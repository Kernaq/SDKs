name: Publish SDKs

# Trigger: push a tag like v1.0.0 or v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

  # Allow manual publish from GitHub Actions UI
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true
      sdk:
        description: "Which SDK to publish: node | java | go | all"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - node
          - java
          - go

permissions:
  contents: read
  packages: write

jobs:

  # ── Node.js → npmjs.com ───────────────────────────────────────────────────
  publish-node:
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.sdk == 'all' ||
      github.event.inputs.sdk == 'node'
    defaults:
      run:
        working-directory: identity/node

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Java → GitHub Packages Maven ───────────────────────────────────────────
  publish-java:
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.sdk == 'all' ||
      github.event.inputs.sdk == 'java'
    defaults:
      run:
        working-directory: identity/java

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Write Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: mvn versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Go — no publish step needed ────────────────────────────────────────────
  tag-go:
    runs-on: ubuntu-latest
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      github.event.inputs.sdk == 'all' ||
      github.event.inputs.sdk == 'go'
    steps:
      - uses: actions/checkout@v4
      - name: Verify go.mod
        run: cat identity/go/go.mod
      - name: Go module is available
        run: |
          echo "Go SDK available at:"
          echo "  go get github.com/Kernaq/SDKs/identity/go@${GITHUB_REF#refs/tags/}"
