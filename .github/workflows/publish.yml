name: Publish SDKs

# Trigger: push a tag like v1.0.0 or v1.2.3
on:
  push:
    tags:
      - "v*.*.*"

  # Also allow manual publish from GitHub Actions UI
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:

  # ── Node.js → GitHub Packages npm ──────────────────────────────────────────
  publish-node:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity/node

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@kernaq"

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: npm version ${{ github.event.inputs.version }} --no-git-tag-version

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Java → GitHub Packages Maven ───────────────────────────────────────────
  publish-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: identity/java

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Write Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          mvn versions:set -DnewVersion=$VERSION -DgenerateBackupPoms=false

      - name: Set version from input
        if: github.event_name == 'workflow_dispatch'
        run: mvn versions:set -DnewVersion=${{ github.event.inputs.version }} -DgenerateBackupPoms=false

      - name: Publish to GitHub Packages
        run: mvn --batch-mode deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Go — no publish step needed ────────────────────────────────────────────
  # Go modules are distributed directly from the public repo.
  # Just tag and the module is available via:
  #   go get github.com/Kernaq/SDKs/identity/go@v1.0.0
  tag-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify go.mod
        run: cat identity/go/go.mod
      - name: Go module is available
        run: |
          echo "Go SDK available at:"
          echo "  go get github.com/Kernaq/SDKs/identity/go@${GITHUB_REF#refs/tags/}"
