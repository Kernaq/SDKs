[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "kernaq-identity"
version     = "1.0.0"
description = "Official Python SDK for the Kernaq Identity API"
readme      = "README.md"
license     = { text = "Commercial" }
requires-python = ">=3.10"
keywords    = ["kyc", "identity", "verification", "ocr", "face", "liveness"]

dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-httpx>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["kernaq"]
