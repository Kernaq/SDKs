[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "kernaq-identity"
version     = "1.0.0"
description = "Official Python SDK for the Kernaq Identity API"
readme      = "README.md"
license     = { text = "Commercial" }
requires-python = ">=3.10"
keywords    = ["kyc", "identity", "verification", "ocr", "face", "liveness", "kernaq"]

# httpx pinned to a stable minor — avoids breaking changes from open-range.
dependencies = [
    "httpx==0.27.0",
]

[project.optional-dependencies]
# python-dotenv is only needed for local development examples.
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["kernaq"]
